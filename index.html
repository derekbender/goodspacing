<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/ultra-gs.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Ultra by Astigmatic (Apache 2.0), subset to G and S. See /fonts/LICENSE.txt */
  @font-face {
    font-family: 'Ultra';
    src: url('/fonts/ultra-gs.woff2') format('woff2');
    font-display: block;
  }
  :root {
    --ink: #1a1918;
    --paper: #f4f2ee;
    --swap: 700ms cubic-bezier(.65, 0, .35, 1);
  }
  :root.inverted { --ink: #f4f2ee; --paper: #1a1918; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    transition: background-color var(--swap);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  h1 { margin: 0; }
  svg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .letter { fill: var(--ink); transition: fill var(--swap); }
  /* Invisible control over the letters: hover/press target and keyboard focus */
  #hit {
    position: fixed;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: none;
    cursor: default;
    touch-action: none;
  }
  #hit:focus { outline: none; }
  #hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 10px; }
</style>
</head>
<body>
<main>
  <h1>
    <svg id="stage" role="img" aria-label="Good Spacing">
      <defs>
        <text id="g" font-family="Ultra" font-size="100">G</text>
        <text id="s" font-family="Ultra" font-size="100">S</text>
        <mask id="not-g" maskUnits="userSpaceOnUse">
          <rect class="mask-bg" fill="#fff"/><use href="#g" fill="#000"/>
        </mask>
        <mask id="not-s" maskUnits="userSpaceOnUse">
          <rect class="mask-bg" fill="#fff"/><use href="#s" fill="#000"/>
        </mask>
      </defs>
      <!-- Each letter is masked by the other, so the overlap shows the background -->
      <use class="letter" href="#g" mask="url(#not-s)"/>
      <use class="letter" href="#s" mask="url(#not-g)"/>
    </svg>
  </h1>
  <button id="hit" type="button" aria-label="Invert colours" aria-pressed="false"></button>
</main>
<script>
(() => {
  // Letter size (px) at each width; linear between points, held flat outside them.
  // 320 and 1440 are the design frames; wide screens top out at 1.2× desktop.
  const SIZES = [[320, 64], [1440, 143], [2560, 143 * 1.2]];
  const MAX_HEIGHT_SHARE = 0.16; // short screens: letters never exceed this share of height
  const OVERLAP = 0.269;  // share of the narrower letter's width that overlaps at rest
  const OFFSCREEN = 0.5;  // share of each letter's width that drifts past the screen edge
  const APART_MS = 2600;
  const TOGETHER_MS = 900;  // linear, so the letters hit at full speed
  const IMPACT_MS = 450;     // squash-and-rebound after the letters collide
  const IMPACT_DEPTH = 0.05; // how far each letter pushes into the other, × font size

  const root = document.documentElement;
  const svg = document.getElementById('stage');
  const g = document.getElementById('g');
  const s = document.getElementById('s');
  const hit = document.getElementById('hit');
  const themeColor = document.querySelector('meta[name=theme-color]');
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  let gx = 0, sx = 0, gMax = 0, sMax = 0, d = 0, raf = 0; // d: 0 together → 1 apart
  let size = 0, bump = 0; // bump: extra outward offset (px) during the impact wobble

  function letterSize(w, h) {
    let size = SIZES[SIZES.length - 1][1];
    if (w <= SIZES[0][0]) size = SIZES[0][1];
    else for (let i = 1; i < SIZES.length; i++) {
      const [w0, s0] = SIZES[i - 1], [w1, s1] = SIZES[i];
      if (w <= w1) { size = s0 + (s1 - s0) * (w - w0) / (w1 - w0); break; }
    }
    return Math.min(size, h * MAX_HEIGHT_SHARE);
  }

  function layout() {
    const w = innerWidth, h = innerHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    for (const el of svg.querySelectorAll('mask, .mask-bg')) {
      el.setAttribute('x', -w); el.setAttribute('y', -h);
      el.setAttribute('width', w * 3); el.setAttribute('height', h * 3);
    }

    size = letterSize(w, h);
    for (const t of [g, s]) { t.setAttribute('font-size', size); t.setAttribute('x', 0); t.setAttribute('y', 0); }
    const gb = g.getBBox(), sb = s.getBBox();
    const overlap = Math.min(gb.width, sb.width) * OVERLAP;
    const total = gb.width + sb.width - overlap;
    const left = (w - total) / 2;
    const baseline = h / 2 - (gb.y + gb.height / 2);

    gx = left - gb.x;
    sx = left + gb.width - overlap - sb.x;
    gMax = left + gb.width * OFFSCREEN;
    sMax = w - (left + total) + sb.width * OFFSCREEN;
    g.setAttribute('y', baseline);
    s.setAttribute('y', baseline);

    Object.assign(hit.style, {
      left: left + 'px',
      top: (h - gb.height) / 2 + 'px',
      width: total + 'px',
      height: gb.height + 'px',
    });
    place();
  }

  function place() {
    g.setAttribute('x', gx - d * gMax - bump);
    s.setAttribute('x', sx + d * sMax + bump);
  }

  // Tween from wherever the letters are now, so interrupted moves stay smooth
  function moveTo(target, ms, curve, onDone) {
    cancelAnimationFrame(raf);
    bump = 0;
    const from = d, t0 = performance.now();
    const dur = reduced.matches ? 0 : ms * Math.abs(target - from);
    const step = now => {
      const t = dur ? Math.min(1, (now - t0) / dur) : 1;
      d = from + (target - from) * curve(t);
      place();
      if (t < 1) raf = requestAnimationFrame(step);
      else if (onDone && dur) onDone(now);
    };
    raf = requestAnimationFrame(step);
  }

  // Collision: the letters keep moving into each other briefly, then spring back
  // with a small decaying wobble. Starts inward so it continues the incoming motion.
  function impact(t0) {
    const depth = size * IMPACT_DEPTH;
    const step = now => {
      const t = Math.min(1, (now - t0) / IMPACT_MS);
      bump = t < 1 ? -depth * Math.exp(-5 * t) * Math.sin(3 * Math.PI * t) : 0;
      place();
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  const apart = () => moveTo(1, APART_MS, ease);
  // Skip the impact if the letters had barely separated
  const together = () => moveTo(0, TOGETHER_MS, t => t, d > 0.03 ? impact : null);

  // Mouse: hover drifts. Touch: press and hold drifts, a quick tap swaps colours.
  // Keyboard: focusing the letters drifts, Enter/Space swaps colours.
  let pressStart = 0, held = false;
  hit.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') apart(); });
  hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') together(); });
  hit.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    pressStart = performance.now();
    held = true;
    apart();
  });
  hit.addEventListener('focus', () => { if (hit.matches(':focus-visible')) apart(); });
  hit.addEventListener('blur', together);
  const release = () => {
    if (!held) return;
    held = false;
    together();
  };
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  addEventListener('contextmenu', e => e.preventDefault());

  addEventListener('click', () => {
    if (pressStart && performance.now() - pressStart > 300) { pressStart = 0; return; }
    pressStart = 0;
    const inverted = root.classList.toggle('inverted');
    hit.setAttribute('aria-pressed', inverted);
    themeColor.content = inverted ? '#1a1918' : '#f4f2ee';
  });

  addEventListener('resize', layout);
  // Font is preloaded with font-display: block, so the letters only paint once it is ready
  document.fonts.load('100px Ultra').then(layout);
})();
</script>
</body>
</html>
